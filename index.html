<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sommaire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="sommaire-card">
    <div class="sommaire-title">Sommaire</div>
    <ul class="sommaire-list">
      <li class="sommaire-item is-selected has-divider">
        <button type="button" id="collecte-selective" class="sommaire-link">
          <span class="bullet selected"></span>
          <span class="label">Collecte sélective</span>
        </button>
      </li>
      <li class="sommaire-item">
        <button type="button" id="ordures-menageres" class="sommaire-link">
          <span class="bullet"></span>
          <span class="label">Ordures ménagères</span>
        </button>
      </li>
      <li class="sommaire-item">
        <button type="button" id="dechetteries" class="sommaire-link">
          <span class="bullet"></span>
          <span class="label">Déchetteries</span>
        </button>
      </li>
      <li class="sommaire-item">
        <button type="button" id="verre" class="sommaire-link">
          <span class="bullet"></span>
          <span class="label">Verre</span>
        </button>
      </li>
      <li class="sommaire-item">
        <button type="button" id="vetements" class="sommaire-link">
          <span class="bullet"></span>
          <span class="label">Vêtements</span>
        </button>
      </li>
    </ul>
  </nav>
  <script src="script.js"></script>
</body>
</html>
